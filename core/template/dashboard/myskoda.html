<div class="myskoda-tile">
  <style>
    .myskoda-tile { text-align: left; padding: 6px 10px 8px; font-size: 13px; line-height: 1.5; }
    .myskoda-tile .ms-top { display: flex; gap: 12px; align-items: center; }
    .myskoda-tile .ms-photo { flex: 0 0 42%; max-width: 190px; text-align: center; }
    .myskoda-tile .ms-photo img { max-width: 100%; max-height: 110px; }
    .myskoda-tile .ms-frame.ms-render { overflow: hidden; aspect-ratio: 2.3 / 1; }
    .myskoda-tile .ms-frame.ms-render img { width: 100%; height: 100%; max-height: none; object-fit: cover; transform: scale(1.22); }
    .myskoda-tile .ms-alert { margin-top: 8px; padding: 6px 8px; border-radius: 4px; background: rgba(240, 173, 78, 0.2); }
    .myskoda-tile .ms-alert i { color: var(--al-warning-color, #f0ad4e); }
    .myskoda-tile .ms-icons { margin-top: 4px; font-size: 18px; }
    .myskoda-tile .ms-icons i { margin: 0 5px; }
    .myskoda-tile .ms-stale { opacity: 0.35; }
    .myskoda-tile .ms-stale-date { font-size: 11px; opacity: 0.8; }
    .myskoda-tile .ms-ok { color: var(--al-success-color, #5cb85c); }
    .myskoda-tile .ms-warn { color: var(--al-warning-color, #f0ad4e); }
    .myskoda-tile .ms-info { color: var(--al-info-color, #5bc0de); }
    .myskoda-tile .ms-identity { flex: 1 1 auto; min-width: 0; }
    .myskoda-tile .ms-name { font-size: 15px; font-weight: bold; }
    .myskoda-tile .ms-battery { margin: 8px 0 2px; }
    .myskoda-tile .ms-bar { height: 14px; border-radius: 7px; background: rgba(127, 127, 127, 0.25); overflow: hidden; }
    .myskoda-tile .ms-bar > div { height: 100%; border-radius: 7px; background: var(--al-success-color, #5cb85c); }
    .myskoda-tile .ms-battery-text { display: flex; justify-content: space-between; font-weight: bold; }
    .myskoda-tile .ms-cols { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; }
    .myskoda-tile .ms-block { flex: 1 1 170px; min-width: 0; }
    .myskoda-tile .ms-title { font-size: 14px; font-weight: bold; margin: 4px 0 2px; border-bottom: 1px solid rgba(127, 127, 127, 0.35); }
    .myskoda-tile .ms-title i { margin-right: 5px; }
    .myskoda-tile .ms-row { display: flex; justify-content: space-between; gap: 8px; }
    .myskoda-tile .ms-row > span:last-child { text-align: right; font-weight: bold; }
    .myskoda-tile .ms-actions { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px; }
    .myskoda-tile .ms-actions a { flex: 1 1 auto; }
    .myskoda-tile select.ms-select { height: 28px; line-height: 1.2; padding: 2px 22px 2px 6px; width: auto; display: inline-block; font-weight: bold; }
    .myskoda-tile .ms-row { align-items: center; }
    .myskoda-tile .ms-service { margin-top: 6px; }
    .myskoda-tile .ms-foot { margin-top: 6px; font-size: 12px; opacity: 0.8; }
    .myskoda-tile .ms-profile-zone { margin-top: 8px; }
    .myskoda-tile .ms-profiles { margin-top: 5px; font-size: 12px; }
    .myskoda-tile .ms-profiles summary { cursor: pointer; list-style: none; display: block; padding: 4px 8px; border-radius: 4px; font-size: 13px; font-weight: bold; background: rgba(127, 127, 127, 0.2); }
    .myskoda-tile .ms-profiles summary:hover { background: rgba(127, 127, 127, 0.35); }
    .myskoda-tile .ms-profiles summary::-webkit-details-marker { display: none; }
    .myskoda-tile .ms-profiles summary i { margin-right: 6px; transition: transform 0.15s; }
    .myskoda-tile .ms-profiles[open] summary i { transform: rotate(90deg); }
    .myskoda-tile .ms-profile { margin-top: 4px; padding-left: 8px; border-left: 2px solid rgba(127, 127, 127, 0.35); }
    .myskoda-tile .ms-profile-name { font-weight: bold; }
    .myskoda-tile .ms-nowrap { white-space: nowrap; }
  </style>
  <div class="ms-top">
    <div class="ms-photo">
      <div class="ms-frame #ms_image_class#"><img src="#ms_image#" alt="" onerror="this.onerror=null;this.parentNode.className='ms-frame';this.src='plugins/myskoda/plugin_info/myskoda_icon.png'"></div>
      <div class="ms-icons">#ms_icons#</div>
    </div>
    <div class="ms-identity">#ms_identity#</div>
  </div>
  #ms_alert#
  #ms_battery#
  <div class="ms-cols">
    #ms_charge#
    #ms_climate#
  </div>
  #ms_profiles#
  #ms_service#
  <div class="ms-foot">#ms_foot#</div>
  <script>
    (function() {
      var tile = document.querySelector('.eqLogic[data-eqLogic_uid="#uid#"] .myskoda-tile')
      if (!tile) return
      tile.querySelectorAll('a[data-ms-cmd]').forEach(function(button) {
        button.addEventListener('click', function() {
          jeedom.cmd.execute({ id: button.getAttribute('data-ms-cmd') })
        })
      })
      tile.querySelectorAll('select[data-ms-cmd]').forEach(function(select) {
        select.addEventListener('change', function() {
          // Valeur envoyée comme un curseur, ou comme un choix de liste pour le mode de charge (data-ms-key)
          var value = {}
          value[select.getAttribute('data-ms-key') || 'slider'] = select.value
          jeedom.cmd.execute({ id: select.getAttribute('data-ms-cmd'), value: value })
        })
      })
      // Sur le dashboard, Jeedom fige la hauteur d'une tuile au moment où il la place : si son contenu grandit ensuite
      // (liste des profils de charge dépliée, photo chargée après coup), il serait coupé ou déborderait sur la tuile
      // voisine. La tuile est alors remesurée et le dashboard rangé de nouveau. Ailleurs (design, panneau du plugin,
      // version mobile), rien n'est figé : il n'y a rien à faire.
      var host = tile.closest('.eqLogic')
      var fit = function() {
        try {
          if (!host || !document.body.contains(host) || !host.classList.contains('jeedomAlreadyPosition')) return
          if (!window.jeedomUtils || typeof jeedomUtils.positionEqLogic != 'function') return
          host.style.height = 'auto'
          jeedomUtils.positionEqLogic(host.getAttribute('data-eqLogic_id'), false)
          // Rang de hauteur que Jeedom réutilise quand la fenêtre change de taille
          var step = (jeedomUtils.tileHeightSteps || []).indexOf(parseInt(host.style.height) + parseInt(jeedom.theme['widget::margin']))
          if (step >= 0) host.dataset.stepHeight = step
          var grid = host.closest('.div_displayEquipement')
          if (grid && window.Packery && Packery.data(grid)) Packery.data(grid).layout()
        } catch (error) {}
      }
      tile.querySelectorAll('details').forEach(function(list) { list.addEventListener('toggle', fit) })
      tile.querySelectorAll('img').forEach(function(image) { if (!image.complete) image.addEventListener('load', fit) })
    })()
  </script>
</div>
